<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#070f24">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sawan Gym | نادي صوان الرياضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600&family=Lalezar&family=Rakkas&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/webp" href="pics/logo.webp">
<link rel="shortcut icon" type="image/webp" href="pics/logo.webp">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap bar">
<a href="#home" aria-label="Sawan Gym"><img src="pics/logo.webp" alt="Sawan Gym — نادي صوان الرياضي" width="76" height="56"></a>
<nav id="nav" aria-label="Main">
<a href="#home" data-i="n0"></a><a href="#explore" data-i="n1"></a><a href="#offers" data-i="n2"></a><a href="#coaches" data-i="n3"></a><a href="#join" data-i="n4"></a><a href="#contact" data-i="n5"></a>
</nav>
<button class="lang" id="lang" type="button"></button>
<button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
</div></header>

<main id="top">
<section id="home" class="hero page">
<div class="bg"></div>
<div class="wrap">
<h1><span data-i="h1a"></span><span data-i="h1b"></span></h1>
<p data-i="hp"></p>
<div class="cta"><a class="btn main" href="#join" data-i="cta1"></a><a class="btn ghost" href="#explore" data-i="cta2"></a></div>
<div class="chips"><span class="chip" id="stM"><i></i><span></span></span><span class="chip" id="stW"><i></i><span></span></span></div>
</div>
<div class="ledline"></div>
<div class="cue"></div>
</section>

<section id="explore" class="page"><div class="wrap">
<div class="led"></div>
<h2 data-i="e1"></h2>
<div class="hours" id="hoursList"></div>
<div class="slider" id="slider">
<img class="slide" src="pics/1.webp" loading="lazy" decoding="async" alt=""><img class="slide" src="pics/2.webp" loading="lazy" decoding="async" alt=""><img class="slide" src="pics/3.webp" loading="lazy" decoding="async" alt="" style="object-position:center 70%"><img class="slide" id="s4" src="pics/4.webp" loading="lazy" decoding="async" alt="">
<div class="count" id="count"></div></div>
<div class="nums" id="nums"></div>
</div></section>

<section id="offers" class="dark-s page"><div class="wrap">
<div class="led"></div>
<h2 data-i="o1"></h2>
<div class="offers" id="offersList"></div>
</div></section>

<section id="coaches" class="page"><div class="wrap">
<div class="led"></div>
<h2 data-i="t1"></h2><p class="sub" data-i="t2"></p>
<div id="coachFilters"></div>
<div class="coaches" id="coachList"></div>
<div class="more" id="coachMore"></div>
</div></section>

<section id="join" class="page" style="background:#e8eef9"><div class="wrap join">
<div>
<div class="led"></div>
<h2 data-i="j1"></h2><p class="sub" data-i="j2"></p>
<ol class="steps"><li data-i="s1"></li><li data-i="s2"></li></ol>
</div>
<form id="form" novalidate>
<label><span data-i="f1"></span><input id="fn" required autocomplete="name"></label>
<label><span data-i="f2"></span><select id="fs"></select></label>
<label><span data-i="f3"></span><select id="fp"></select></label>
<label><span data-i="f4"></span><textarea id="fm" rows="2"></textarea></label>
<button class="btn main" type="submit" data-i="f5"></button>
<div class="out" id="out">
<label><span data-i="f6"></span><textarea id="msg" readonly></textarea></label>
<div class="row"><button type="button" class="btn dark" id="copy" data-i="f7"></button><a class="btn line" id="igSend" target="_blank" rel="noopener" href="https://ig.me/m/sawan.gym.sy" data-i="f8"></a><a class="btn line" target="_blank" rel="noopener" href="https://www.facebook.com/profile.php?id=61587824453656" data-i="f9"></a></div>
<div class="note" id="note" role="status"></div>
</div>
</form>
</div></section>

<section id="contact" class="page"><div class="wrap">
<div class="led"></div>
<h2 data-i="k1"></h2><p class="sub" data-i="k2"></p>
<div class="tiles" id="tiles"></div>
<div class="mapbox" id="mapbox"></div>
</div></section>
</main>
<footer><div class="ledline"></div><div class="wrap" data-i="ft"></div></footer>

<script src="script.js"></script>
</body>
</html>
